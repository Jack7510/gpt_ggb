# HTTP edge for cpolar: cpolar terminates public TLS and forwards port 80 here.
upstream ggb_dsh_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name ggb-app.cpolar.cn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 40m;

    # The fixed GeoGebra runtime is about 8 MB uncompressed. Compress it and the
    # hashed bundles at the edge so a slow tunnel can finish the first applet
    # handshake within the Client's readiness budget. Never gzip SSE.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json application/manifest+json image/svg+xml application/wasm;

    location /api/ {
        proxy_pass http://ggb_dsh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 1h;
        proxy_set_header Connection '';
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://ggb_dsh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection '';
    }
}
