# Edge tier for the DSH Server (§12).
#
# Terminates TLS, enforces the public Host allowlist, keeps CORS strictly same-origin and
# proxies every request to `apps/api`. The API serves the Client PWA shell and the fixed
# GeoGebra runtime itself (§10 static service), so the edge owns no document root: that
# keeps the runtime manifest/traversal guards in one place.

log_format ggb_run '$remote_addr - $request_id [$time_local] "$request_method $uri" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'rt=$request_time';
# §12: the default `combined` format does not log arbitrary headers, and this format must
# never gain `$http_x_ggb_provider_key`. Keep BYOK out of access logs, APM and WAF bodies.

upstream ggb_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name ggb.example.com;
    # Public Host allowlist: an unknown Host never reaches admission.
    if ($host != ggb.example.com) { return 421; }

    ssl_certificate     /etc/ggb/tls/fullchain.pem;
    ssl_certificate_key /etc/ggb/tls/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # §12 CSP is emitted by `apps/api` per document class (strict shell vs. the dedicated
    # GeoGebra document). Do not add a second `Content-Security-Policy` here: nginx would
    # send both headers and the browser enforces their intersection.
    # No CORS headers are emitted: the PWA and the API are same-origin by construction.

    client_max_body_size 40m;   # matches GGB_V3_MAX_BODY_BYTES

    location /api/ {
        proxy_pass http://ggb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        # runToken stays in the Authorization header; it never enters a URL or a log.
        proxy_set_header Authorization $http_authorization;

        # SSE (§6.4): stream without buffering, and never retry a dropped stream
        # server-side — the Client resumes from its own event cursor.
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 1h;
        proxy_set_header Connection '';
        add_header Cache-Control "no-store" always;
    }

    # Client shell, hashed assets and the fixed runtime; the API owns their caching.
    location / {
        proxy_pass http://ggb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection '';
    }
}
